name: Build & Package

on:
  push:
    branches: [main, master]
    paths:
      - 'customize.sh'
      - 'post-fs-data.sh'
      - 'service.sh'
      - 'uninstall.sh'
      - 'module.prop'
      - 'sepolicy.rule'
      - 'bin/**'
      - 'scripts/**'
      - 'webroot/**'
      - 'update.json'
      - 'NOTICE'
      - '.github/workflows/build-and-package.yml'
  pull_request:
    paths:
      - 'customize.sh'
      - 'post-fs-data.sh'
      - 'service.sh'
      - 'uninstall.sh'
      - 'module.prop'
      - 'sepolicy.rule'
      - 'bin/**'
      - 'scripts/**'
      - 'webroot/**'
      - 'update.json'
      - 'NOTICE'
      - '.github/workflows/build-and-package.yml'
  workflow_dispatch:
    inputs:
      agh_version:
        description: 'AdGuard Home version (empty = latest release)'
        required: false
        default: ''

# 同一分支/标签的构建串行化：并发 push 同时写同一个 Release 会互相覆盖资产
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  AGH_REPO: 'AdguardTeam/AdGuardHome'
  # 钉住 AdGuard Home 版本（留空 = 跟随最新 release，即原有行为）。
  # 为什么需要这个开关：bin/AdGuardHome.yaml 里 schema_version 是写死的（当前 34），
  # 而 AGH 升级 schema 后首次启动会「静默原地迁移」用户的 /data/adb/agh/AdGuardHome.yaml；
  # 之后若回退到旧模块（配旧版 AGH 二进制），AGH 会因 schema 只升不降而拒绝启动。
  # 想可复现构建 / 想安全回退时，在这里填版本号（如 0.107.79）即可。
  AGH_VERSION: ''
  # AdGuard Home 官方 release 中 Linux arm64 资产名为 .tar.gz（内部为裸二进制 AdGuardHome）
  AGH_ASSET: 'AdGuardHome_linux_arm64.tar.gz'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 解析 AdGuard Home 版本（写入 outputs，供后续步骤和 release 使用） ----
      - name: Determine AdGuard Home version
        id: agh_ver
        run: |
          set -eu
          # inputs.agh_version 仅在 workflow_dispatch 事件下有效；push/PR 下为空
          # 优先级：workflow_dispatch 输入 > env.AGH_VERSION 钉版本 > 最新 release
          VER="${{ github.event.inputs.agh_version || env.AGH_VERSION || '' }}"
          if [ -n "$VER" ]; then
            VER="${VER#v}"
            echo "Verifying requested version v${VER}..."
            curl -fsSL "https://api.github.com/repos/${AGH_REPO}/releases/tags/v${VER}" -o /dev/null
          else
            VER="$(curl -fsSL "https://api.github.com/repos/${AGH_REPO}/releases/latest" \
                    | grep -oP '"tag_name":\s*"v\K[^"]+' | head -n1)"
            [ -n "$VER" ] || { echo "::error::Failed to resolve latest AdGuard Home version"; exit 1; }
            echo "Resolved latest stable AdGuard Home: v${VER}"
          fi
          # 写入 step outputs（供 ${{ steps.agh_ver.outputs.* }} 使用）
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=agh-v${VER}" >> "$GITHUB_OUTPUT"

      # ---- 获取 arm64 二进制（tar.gz，内部为裸 AdGuardHome 可执行文件） ----
      - name: Download AdGuard Home arm64 binary
        run: |
          set -eu
          VER="${{ steps.agh_ver.outputs.version }}"
          URL="https://github.com/${AGH_REPO}/releases/download/v${VER}/${AGH_ASSET}"
          echo "Downloading ${URL}"
          curl -fsSL --retry 3 "${URL}" -o /tmp/agh.tar.gz
          tar -xzf /tmp/agh.tar.gz -C /tmp/
          # tar 包内可能是裸二进制 AdGuardHome，也可能含子目录，递归查找
          BIN="$(find /tmp -maxdepth 3 -type f \( -name 'AdGuardHome' -o -name 'AdGuardHome-*' \) 2>/dev/null | head -n1)"
          [ -n "$BIN" ] || { echo "::error::AdGuardHome binary not found in release asset"; exit 1; }
          file "$BIN"
          # 校验：必须是 ELF 可执行文件（防止下载到 HTML 404 页面）
          if ! file "$BIN" | grep -q 'ELF\|executable\|a.out'; then
            echo "::error::Downloaded file does not look like a Linux binary: $(file "$BIN")"
            exit 1
          fi
          mkdir -p bin
          cp "$BIN" bin/AdGuardHome
          chmod +x bin/AdGuardHome
          rm -f /tmp/agh.tar.gz
          ls -lh bin/AdGuardHome

      - name: Verify bin/AdGuardHome
        run: |
          set -eu
          [ -f bin/AdGuardHome ] || { echo "::error::bin/AdGuardHome missing"; exit 1; }
          [ -x bin/AdGuardHome ] || { echo "::error::bin/AdGuardHome not executable"; exit 1; }
          file bin/AdGuardHome
      - name: Normalize shell script line endings to LF
        run: |
          set -eu
          for f in customize.sh post-fs-data.sh service.sh uninstall.sh \
                   scripts/common.sh scripts/iptables.sh scripts/watchdog.sh scripts/control.sh scripts/api.cgi; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
            if grep -q $'\r' "$f"; then
              echo "Fixing CRLF -> LF: $f"
              sed -i 's/\r$//' "$f"
            fi
            chmod +x "$f"
          done

      - name: Static syntax check
        run: |
          set -eu
          for f in customize.sh post-fs-data.sh service.sh uninstall.sh \
                   scripts/common.sh scripts/iptables.sh scripts/watchdog.sh scripts/control.sh scripts/api.cgi; do
            echo "--- syntax check: $f"
            sh -n "$f"
          done

      # sh -n 只查语法，查不出「nounset 下裸引用未定义变量」「未加引号的变量展开」
      # 「命令替换吞掉退出码」这类问题 —— 本仓库最近两次事故恰好都属于这一类
      # （customize.sh 的 set -u 泄漏、common.sh 的 $1 / $KSU_MODDIR 裸引用）。
      # 只对 error 级别失败（-S error），warning 仅提示，避免历史遗留问题阻塞构建。
      - name: ShellCheck
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -s sh -S error customize.sh post-fs-data.sh service.sh uninstall.sh \
                     scripts/common.sh scripts/iptables.sh scripts/watchdog.sh scripts/control.sh scripts/api.cgi

      # ---- 打包模块 ZIP ----
      - name: Package module ZIP
        id: pkg
        run: |
          set -eu
          VER="${{ steps.agh_ver.outputs.version }}"
          ARTIFACT="AdGuardHomeFree-${VER}-module.zip"
          STAGE="AdGuardHomeFree"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -r module.prop customize.sh post-fs-data.sh service.sh uninstall.sh sepolicy.rule update.json NOTICE "$STAGE/"
          cp -r bin "$STAGE/bin"
          cp -r scripts "$STAGE/scripts"
          if [ -d webroot ]; then
            cp -r webroot "$STAGE/webroot"
          fi

          {
            echo "module_id=adguardhomefree"
            echo "agh_version=${VER}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
          } > "$STAGE/build-info.txt"

          # ---- 生成随 release 分发的 update.json ----
          # 旧版 updateJson 指向 main 分支的静态文件，versionCode 永不变化，
          # 模块管理器始终判定「已是最新」，自动更新形同虚设。
          MOD_VERSION="$(sed -n 's/^version=//p' module.prop | head -n1)"
          MOD_CODE="$(sed -n 's/^versionCode=//p' module.prop | head -n1)"
          [ -n "$MOD_VERSION" ] || { echo "::error::module.prop 缺少 version"; exit 1; }
          [ -n "$MOD_CODE" ] || { echo "::error::module.prop 缺少 versionCode"; exit 1; }
          {
            echo "{"
            echo "  \"version\": \"${MOD_VERSION}\","
            echo "  \"versionCode\": ${MOD_CODE},"
            echo "  \"zipUrl\": \"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AdGuardHomeFree-module.zip\","
            echo "  \"changelog\": \"https://github.com/${GITHUB_REPOSITORY}/releases/latest\""
            echo "}"
          } > "$STAGE/update.json"
          echo "MODULE ${MOD_VERSION} (${MOD_CODE})"

          # 打 ZIP（ZIP 顶层即模块根目录，便于 Magisk 安装器识别）
          (cd "$STAGE" && zip -r "../${ARTIFACT}" .)
          # 另产出一个无版本号产物，供 update.json 的 releases/latest/download 稳定指向
          cp "${ARTIFACT}" "AdGuardHomeFree-module.zip"
          rm -rf "$STAGE"

          # 写入 step outputs（供后续步骤使用）
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "latest_artifact=AdGuardHomeFree-module.zip" >> "$GITHUB_OUTPUT"
          echo "PACKAGED ${ARTIFACT}"
          unzip -l "${ARTIFACT}"

      # ---- 上传 artifact（PR 与手动触发也可下载） ----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdGuardHomeFree-module
          path: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.latest_artifact }}
          if-no-files-found: error

      # ---- 仅在 push 到主分支时创建/更新 Release ----
      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.agh_ver.outputs.tag }}
          name: "AdGuardHomeFree (AGH v${{ steps.agh_ver.outputs.version }})"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## AdGuard Home Free Module

            | 项 | 值 |
            |---|---|
            | AdGuard Home | v${{ steps.agh_ver.outputs.version }} |
            | Commit | `${{ github.sha }}` |

            ### 安装
            1. 下载本 release 的 `AdGuardHomeFree-${{ steps.agh_ver.outputs.version }}-module.zip`
            2. 通过 Magisk / KernelSU / APatch 安装
            3. 重启设备

            ### 自动更新
            - 无版本号产物 `AdGuardHomeFree-module.zip` 始终指向本 release 最新包，
              供 `update.json`（`releases/latest/download/...`）使用。
            - 模块管理器中已声明 `updateJson` 更新源，可直接检测新版本。

            ### 说明
            - 默认 DNS 端口: 5591 (0.0.0.0 / ::)
            - 管理台: 127.0.0.1:3000
            - 控制台 API: 127.0.0.1:5592
            - 配置目录: /data/adb/agh
          files: |
            ${{ steps.pkg.outputs.artifact }}
            ${{ steps.pkg.outputs.latest_artifact }}



